# 型検査・単体テスト・LINEなしで動くビルドを確かめ、Webchat だけのビルドに LINE の SDK が入らないことも確かめる（使う作品は .env の XSTORYLIFF_PROJECT。無ければデモ）
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:mock
      # LINE の SDK は、LIFF ID のあるビルドにだけ入る。入るはずのビルドでも見て、manifest の読み方が古くなっていないことを確かめる。
      # Webchat だけのビルドは、作品の .env などに LINE の値があっても空で上書きする
      - name: LINE の SDK は Webchat だけのビルドに入らない
        run: |
          VITE_LIFF_ID=1234567890-example VITE_API_BASE_URL=https://bot.example.com VITE_BOT=story npm run build -- --manifest
          grep -q '@line/liff' dist/.vite/manifest.json
          VITE_LIFF_ID= VITE_API_BASE_URL= VITE_BOT= VITE_WEBCHAT_ORIGIN=https://chat.example.com npm run build -- --manifest
          test -f dist/.vite/manifest.json
          if grep -q '@line/liff' dist/.vite/manifest.json; then echo "Webchat だけのビルドに LINE の SDK が入っています"; exit 1; fi
